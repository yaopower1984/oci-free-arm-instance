name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-vm-creator
  cancel-in-progress: false

env:
  SUPPRESS_LABEL_WARNING: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Phoenix configuration
  OCI_CLI_REGION: "us-phoenix-1"
  AD_NAME: "ULyM:PHX-AD-3"
  IMAGE_ID: "ocid1.image.oc1.phx.aaaaaaaad2gf5wfcfwu4npq4krn2mojhb4usegjtlwkcyee2oq32qu3x45ta"
  SUBNET_ID: "ocid1.subnet.oc1.phx.aaaaaaaafqectyateqrfoe2kc7fm3yn4hn4crnyjwxpxhwrqb46az6vg7ota"
  INSTANCE_NAME: "coolify-vm"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup OCI CLI and try to create VM
        id: create_vm
        continue-on-error: true
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -uo pipefail

          outputs_written=false

          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          set_multiline_output() {
            local name="$1"
            local value="$2"
            local delimiter
            delimiter="ghadelimiter_${RANDOM}_$(date +%s)"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          finish() {
            set_output "result" "$1"
            set_output "color" "$2"
            set_output "summary" "$3"
            set_multiline_output "log_data" "$4"
            outputs_written=true
          }

          # shellcheck disable=SC2329  # Invoked indirectly by the EXIT trap.
          on_exit() {
            local exit_code=$?
            trap - EXIT
            if [ "$outputs_written" != "true" ]; then
              set +e
              finish "error" "0xdc3545" \
                "❌ Workflow stopped unexpectedly" \
                "The create step exited with code $exit_code before a classified result was produced."
            fi
            exit "$exit_code"
          }
          trap on_exit EXIT

          required_vars=(
            COMPARTMENT_ID
            OCI_CLI_USER
            OCI_CLI_TENANCY
            OCI_CLI_FINGERPRINT
            OCI_CLI_KEY_CONTENT
            SSH_PUBLIC_KEY
            DISCORD_WEBHOOK_URL
          )
          missing_vars=()
          for variable_name in "${required_vars[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              missing_vars+=("$variable_name")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            missing_message="Missing required GitHub Secrets: ${missing_vars[*]}"
            echo "::error::$missing_message"
            finish "error" "0xdc3545" "❌ Configuration error" "$missing_message"
            exit 1
          fi

          python -m pip install --user oci-cli

          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          {
            echo "[DEFAULT]"
            echo "user=$OCI_CLI_USER"
            echo "tenancy=$OCI_CLI_TENANCY"
            echo "fingerprint=$OCI_CLI_FINGERPRINT"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
            echo "region=$OCI_CLI_REGION"
          } > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$SSH_PUBLIC_KEY" > /tmp/ssh_key.pub
          chmod 600 /tmp/ssh_key.pub

          # Prevent duplicate creation when a non-terminated instance with the
          # configured display name already exists.
          LIST_OUTPUT_FILE=$(mktemp)
          LIST_ERROR_FILE=$(mktemp)
          PARSE_ERROR_FILE=$(mktemp)

          set +e
          oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "$INSTANCE_NAME" \
            --all >"$LIST_OUTPUT_FILE" 2>"$LIST_ERROR_FILE"
          LIST_EXIT_CODE=$?
          set -e

          LIST_OUTPUT=$(cat "$LIST_OUTPUT_FILE")
          LIST_ERROR=$(cat "$LIST_ERROR_FILE")

          if [ "$LIST_EXIT_CODE" -ne 0 ]; then
            truncated_log=$(printf '%s' "$LIST_ERROR" | tail -c 3000)
            finish "error" "0xdc3545" "❌ Could not check existing instances" \
              "OCI exit code: $LIST_EXIT_CODE; $truncated_log"
            exit 1
          fi

          if [ -z "${LIST_OUTPUT//[[:space:]]/}" ]; then
            truncated_log=$(printf '%s' "$LIST_ERROR" | tail -c 3000)
            finish "error" "0xdc3545" "❌ OCI returned an empty instance list" \
              "The list command exited successfully but returned no JSON. OCI stderr: ${truncated_log:-none}"
            exit 1
          fi

          set +e
          EXISTING_INSTANCE_ID=$(
            printf '%s' "$LIST_OUTPUT" |
              python -c 'import json, sys; instances = json.load(sys.stdin).get("data", []); print(next((item.get("id", "") for item in instances if item.get("lifecycle-state") != "TERMINATED"), ""))' \
                2>"$PARSE_ERROR_FILE"
          )
          PARSE_EXIT_CODE=$?
          set -e

          if [ "$PARSE_EXIT_CODE" -ne 0 ]; then
            PARSE_ERROR=$(cat "$PARSE_ERROR_FILE")
            truncated_log=$(printf '%s' "$LIST_OUTPUT" | tail -c 2000)
            finish "error" "0xdc3545" "❌ Could not parse OCI instance list" \
              "Parser exit code: $PARSE_EXIT_CODE; ${PARSE_ERROR:-unknown parser error}; OCI stdout: $truncated_log"
            exit 1
          fi

          if [ -n "$EXISTING_INSTANCE_ID" ]; then
            finish "already_exists" "0x28a745" \
              "🛡️ Existing instance detected; creation skipped" \
              "A non-terminated instance named $INSTANCE_NAME already exists."
            exit 0
          fi

          # Capture stdout, stderr, and the real OCI exit code separately so
          # warnings cannot corrupt the JSON used for success detection.
          OCI_OUTPUT_FILE=$(mktemp)
          OCI_ERROR_FILE=$(mktemp)

          set +e
          oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/tmp/ssh_key.pub" \
            --assign-public-ip true \
            --display-name "$INSTANCE_NAME" \
            --boot-volume-size-in-gbs 100 >"$OCI_OUTPUT_FILE" 2>"$OCI_ERROR_FILE"
          OCI_EXIT_CODE=$?
          set -e

          OCI_OUTPUT=$(cat "$OCI_OUTPUT_FILE")
          OCI_ERROR=$(cat "$OCI_ERROR_FILE")
          OCI_LOG="${OCI_ERROR}${OCI_ERROR:+$'\n'}${OCI_OUTPUT}"
          truncated_log=$(printf '%s' "$OCI_LOG" | tail -c 3000)

          if [ "$OCI_EXIT_CODE" -eq 0 ] &&
             printf '%s' "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            finish "created" "0x28a745" \
              "🚀 VM created; duplicate protection is now active" \
              "OCI exit code: $OCI_EXIT_CODE; $truncated_log"
            exit 0
          elif printf '%s' "$OCI_LOG" | grep -qi 'Out of host capacity'; then
            finish "capacity_wait" "0xffa500" \
              "⏳ Waiting for Oracle capacity; the next scheduled run will retry" \
              "OCI exit code: $OCI_EXIT_CODE; $truncated_log"
            exit 0
          else
            finish "error" "0xdc3545" \
              "❌ OCI returned an unexpected error" \
              "OCI exit code: $OCI_EXIT_CODE; $truncated_log"
            exit 1
          fi

      - name: Send Discord notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ (steps.create_vm.outputs.result == 'created' || steps.create_vm.outputs.result == 'already_exists' || steps.create_vm.outputs.result == 'capacity_wait') && 'Success' || 'Failure' }}
          color: ${{ steps.create_vm.outputs.color || '0xdc3545' }}
          title: "OCI Bot Status"
          description: |
            **Result:**
            ${{ steps.create_vm.outputs.summary || '❌ Workflow stopped before producing a result.' }}

            **Details:**
            ```text
            ${{ steps.create_vm.outputs.log_data || 'No diagnostic output was captured.' }}
            ```

      - name: Fail workflow on configuration or OCI error
        if: steps.create_vm.outcome == 'failure' || steps.create_vm.outputs.result == 'error'
        run: exit 1
